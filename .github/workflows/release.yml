name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after all 12 v5 PRs have landed and passed their checks'
        type: boolean
        required: true
        default: false

# Avoid overlapping releases when several commits land on master at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the complete v5 release contract
        run: |
          test -f docs/v5/ACCEPTANCE_CHECKLIST.md
          test -f docs/v5/MIGRATION.md

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config user.name "ealush"
          git config user.email "code@ealush.com"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

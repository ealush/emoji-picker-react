name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (semantic-release decides the version)'
        type: boolean
        required: true
        default: false

# Avoid overlapping releases when several commits land on master at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config user.name "ealush"
          git config user.email "code@ealush.com"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The version commit is [skip ci], so the website would keep the
      # previous package version (and, before 5.0.0, its "v5 preview"
      # notices). A workflow dispatched with GITHUB_TOKEN does run.
      - name: Redeploy the website with the released version
        run: gh workflow run website.yml --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

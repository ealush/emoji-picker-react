name: tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:contracts
      - run: npm test
      - run: npm run check:data-package

  # Peer floor is >=16.8 by API inventory (scripts/checkReactApiFloor.ts);
  # this fails the build if src ever adopts a newer React API.
  api-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run check:react-floor

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:visual

  # llms.txt is generated from committed docs; fail if it drifts.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run docs:llms
      - run: git diff --exit-code -- llms.txt
      - run: npm run recipes
      - run: npm run registry
      - run: npm run designs
      - run: git diff --exit-code -- website/src/components/designs website/src/styles/designs website/public/recipes website/public/designs website/public/r stories/recipes docs/designs README.md

  # Packaging gates: the build (including the entries build with its
  # fail-hard declaration emit), the type-compatibility fixtures (v4
  # usage, v5 contract, exports-map resolution), the size budgets for
  # every entry, and the packed-consumer checks (publint + attw).
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:compat
      - run: npm run size
      - run: npm run check:package
      - run: npm run check:react16


  website-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
            example/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/upload-artifact@v4
        with:
          name: website-candidate
          path: website/out
      # The example app consumes the same local package; it must keep
      # type-checking and building against every usage path.
      - run: npm ci
        working-directory: example
      - run: npm run build
        working-directory: example

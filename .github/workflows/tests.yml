name: tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # Peer floor is >=16.8 by API inventory (scripts/checkReactApiFloor.js);
  # this fails the build if src ever adopts a newer React API.
  api-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check:react-floor

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:visual
      # Actual/diff images let environment drift be adjudicated from the CI
      # image itself (docs/v5/VISUAL_COMPATIBILITY.md).
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence
          path: test-results/
          retention-days: 14

  # Real-consumer visual integrations: drives every runnable fixture in
  # stories/consumers/ through open/search/select flows and compares the
  # committed baselines in playwright/consumer-integrations.spec.ts-snapshots.
  consumer-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test consumer-integrations
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-visual-evidence
          path: |
            test-results/
            playwright/consumer-integrations.spec.ts-snapshots/*-actual.png
            playwright/consumer-integrations.spec.ts-snapshots/*-diff.png
          retention-days: 14

  # Packaging gates: the build (including the entries build with its
  # fail-hard declaration emit), the type-compatibility fixtures (v4
  # usage, v5 contract, exports-map resolution), the size budgets for
  # every entry, and the packed-consumer checks (publint + attw).
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:compat
      - run: npm run size
      - run: npm run check:package
      - run: npm run check:react16

  # llms.txt is generated from committed docs; fail if it drifts.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run docs:llms
      - run: git diff --exit-code -- llms.txt llms-full.txt website/public/llms.txt website/public/llms-full.txt
      # The website gallery, README screenshots and gallery are generated
      # from stories/recipes; fail if a recipe changed without `npm run designs`.
      - run: npm ci --ignore-scripts
      - run: npm run recipes
      - run: npm run registry
      - run: npm run designs
      - run: git diff --exit-code -- website/src/components/designs website/src/styles/designs website/public/recipes website/public/r stories/recipes docs/designs README.md

  browser-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --config playwright.behavior.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-behavior-evidence
          path: test-results/

  website-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/upload-artifact@v4
        with:
          name: website-candidate
          path: website/out

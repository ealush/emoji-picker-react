name: Weekly emoji data update

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Never let a manual run and the schedule push competing data commits.
concurrency:
  group: weekly-emoji
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update emoji sources to latest
        run: npm install --save-dev emoji-datasource@latest emojibase-data@latest

      # The library build regenerates src/data (build:data:src) and the
      # packaged datasets with their ESM/CJS twins.
      - name: Regenerate datasets
        run: npm run build

      - name: Detect a data change
        id: data
        run: |
          # Only the generated datasets decide: npm may rewrite package.json
          # or the lockfile (key order, ranges) without any data change, and
          # that must not cut a release.
          if git diff --quiet -- src/data; then
            echo "No emoji data change - nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- src/data
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # New data must pass the same gates as a code change before it lands
      # on master: picker behavior, the shipped data entries, public types,
      # the bundle budgets (the main entry embeds the English dataset) and
      # packed CJS/ESM consumers. A failure leaves master untouched.
      - name: Verify the regenerated data
        if: steps.data.outputs.changed == 'true'
        run: |
          npm test
          npm run check:data-package
          npm run check:compat
          npm run size
          npm run check:package

      # Only the dataset sources and the dependency update are committed;
      # dist and other build outputs stay out of git. The chore(data) scope
      # maps to a patch release via releaseRules in .releaserc.json.
      - name: Commit the data update
        if: steps.data.outputs.changed == 'true'
        run: |
          git config user.name "ealush"
          git config user.email "code@ealush.com"
          git add package.json package-lock.json src/data
          git commit -m "chore(data): weekly emoji data update"
          git push origin HEAD:master

      # A push made with GITHUB_TOKEN does not trigger other workflows, so
      # dispatch the Release workflow explicitly (dispatches do run).
      - name: Release the data update
        if: steps.data.outputs.changed == 'true'
        run: gh workflow run release.yml --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

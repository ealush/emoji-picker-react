# Builds and deploys the website/ demo site to GitHub Pages.
#
# The demo consumes the library from this repository (website/package.json:
# "emoji-picker-react": "file:..", copied via website/.npmrc install-links),
# so it always showcases the code next to it — including APIs not yet on
# npm. The library is built first, then installed into the website.
name: Website

on:
  push:
    branches: ["master"]
    paths: ["website/**", "src/**", "package.json", "package-lock.json"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - name: Build the library
        working-directory: .
        # The package's prepare script builds dist/.
        run: npm ci
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          # NOTE: this does not inject basePath; the subpath prefix lives in
          # website/next.config.js and is verified by "Verify subpath asset
          # URLs" below.
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: website/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('website/package-lock.json') }}-${{ hashFiles('website.[jt]s', 'website.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('website/package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      - name: Build with Next.js
        run: npx --no-install next build
        # NOTE: Next 15 removed `next export`; with `output: 'export'` in
        # website/next.config.js, `next build` writes `out/` directly.
      - name: Verify subpath asset URLs
        run: |
          matches=$(grep -rhoE '(src|href)="/_next/[^"]*"' out/ || true)
          if [ -n "$matches" ]; then
            echo "$matches" | head -5
            echo "Root-absolute asset URLs found; the export is missing its basePath." >&2
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
